<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Load test results: isolation throughput by tenant, and per-scenario summary">
  <rect width="960" height="420" fill="#0b1220"/>
  <text x="16" y="28" fill="#e8edf5" font-size="15" font-weight="bold">MEASURED, NOT ESTIMATED</text>
  <text x="944" y="28" fill="#7e8aa3" font-size="10" text-anchor="end">2 vCPU host · 1 API pod + 1 worker · thresholds are CI gates</text>
  <line x1="16" y1="40" x2="944" y2="40" stroke="#23324d"/>

  <!-- ================= isolation: rps by tenant (linear scale) ================= -->
  <rect x="16" y="52" width="520" height="308" rx="8" fill="#111a2e" stroke="#23324d"/>
  <text x="32" y="74" fill="#e8edf5" font-size="11" font-weight="bold">NOISY NEIGHBOUR — req/s by tenant (linear scale)</text>
  <text x="32" y="88" fill="#7e8aa3" font-size="9">1 enterprise floods · 4 free plans behave like people · 0 5xx</text>

  <!-- y grid: 0,200,400,600,800 over plot y=250 (baseline) .. y=106 (top) => 144px per 200 -->
  <g stroke="#23324d">
    <line x1="44" y1="250" x2="516" y2="250"/>
    <line x1="44" y1="178" x2="516" y2="178"/>
    <line x1="44" y1="106" x2="516" y2="106"/>
  </g>
  <g fill="#7e8aa3" font-size="8" text-anchor="end">
    <text x="40" y="253">0</text>
    <text x="40" y="181">200</text>
    <text x="40" y="109">400</text>
  </g>
  <!-- attacker 772.4 rps => h = 772.4/200*144 = 556 ... capped at plot top (y=106-8) -->
  <rect x="64" y="106" width="72" height="144" fill="#f87171"/>
  <!-- victims 15.6 rps => h = 11px -->
  <rect x="162" y="239" width="72" height="11" fill="#34d399"/>
  <rect x="260" y="239" width="72" height="11" fill="#34d399"/>
  <rect x="358" y="239" width="72" height="11" fill="#34d399"/>
  <rect x="456" y="239" width="72" height="11" fill="#34d399"/>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <text x="100" y="100" fill="#f87171">772</text>
    <text x="198" y="233" fill="#34d399">15.6</text>
    <text x="296" y="233" fill="#34d399">15.6</text>
    <text x="394" y="233" fill="#34d399">15.5</text>
    <text x="492" y="233" fill="#34d399">15.6</text>
  </g>
  <g font-size="8" fill="#7e8aa3" text-anchor="middle">
    <text x="100" y="264">attacker</text><text x="100" y="274">enterprise · 29% 429</text>
    <text x="198" y="264">victim 1</text><text x="198" y="274">p95 9.7 ms</text>
    <text x="296" y="264">victim 2</text><text x="296" y="274">p95 9.7 ms</text>
    <text x="394" y="264">victim 3</text><text x="394" y="274">p95 8.8 ms</text>
    <text x="492" y="264">victim 4</text><text x="492" y="274">p95 9.6 ms</text>
  </g>
  <text x="100" y="292" fill="#f87171" font-size="8" text-anchor="middle">p95 14.4 ms</text>
  <text x="276" y="316" fill="#e8edf5" font-size="10" text-anchor="middle">the attacker's bar is ~50× taller — the victims' latency never noticed</text>
  <text x="276" y="330" fill="#7e8aa3" font-size="9" text-anchor="middle">their ~55% 429s are their own free-plan bucket, not the attacker's noise</text>
  <text x="276" y="348" fill="#7e8aa3" font-size="8" text-anchor="middle">offered 835 rps total · 50,375 req · 0 5xx · attacker's report floods admitted by bulk bucket: queue stayed at 0</text>

  <!-- ================= scenario summary ================= -->
  <rect x="556" y="52" width="388" height="308" rx="8" fill="#111a2e" stroke="#23324d"/>
  <text x="572" y="74" fill="#e8edf5" font-size="11" font-weight="bold">THREE GATED RUNS (same host, one after another)</text>
  <g font-size="9">
    <text x="572" y="96" fill="#7e8aa3">SCENARIO</text>
    <text x="700" y="96" fill="#7e8aa3" text-anchor="end">RPS</text>
    <text x="764" y="96" fill="#7e8aa3" text-anchor="end">P95</text>
    <text x="828" y="96" fill="#7e8aa3" text-anchor="end">5XX</text>
    <text x="928" y="96" fill="#7e8aa3" text-anchor="end">CACHE HIT</text>
    <line x1="572" y1="104" x2="928" y2="104" stroke="#23324d"/>

    <text x="572" y="124" fill="#e8edf5">smoke · 6 s</text>
    <text x="700" y="124" fill="#60a5fa" text-anchor="end">115</text>
    <text x="764" y="124" fill="#34d399" text-anchor="end">4.8 ms</text>
    <text x="828" y="124" fill="#34d399" text-anchor="end">0</text>
    <text x="928" y="124" fill="#34d399" text-anchor="end">99.7%</text>

    <text x="572" y="148" fill="#e8edf5">capacity · 45 s</text>
    <text x="700" y="148" fill="#60a5fa" text-anchor="end">536</text>
    <text x="764" y="148" fill="#34d399" text-anchor="end">7.3 ms</text>
    <text x="828" y="148" fill="#34d399" text-anchor="end">0</text>
    <text x="928" y="148" fill="#34d399" text-anchor="end">99.7%</text>

    <text x="572" y="172" fill="#e8edf5">isolation · 60 s</text>
    <text x="700" y="172" fill="#60a5fa" text-anchor="end">835</text>
    <text x="764" y="172" fill="#34d399" text-anchor="end">7.6 ms</text>
    <text x="828" y="172" fill="#34d399" text-anchor="end">0</text>
    <text x="928" y="172" fill="#34d399" text-anchor="end">99.7%</text>
  </g>
  <line x1="572" y1="188" x2="928" y2="188" stroke="#23324d"/>
  <text x="572" y="210" fill="#e8edf5" font-size="11" font-weight="bold">CAPACITY — who got throttled (the plan working)</text>
  <g font-size="9">
    <text x="572" y="230" fill="#f87171">free plan</text>
    <text x="928" y="230" fill="#f87171" text-anchor="end">95% of requests 429 — 5 rps sustained read budget</text>
    <text x="572" y="248" fill="#fbbf24">pro plan</text>
    <text x="928" y="248" fill="#fbbf24" text-anchor="end">18.9% 429 — 100 rps sustained</text>
    <text x="572" y="266" fill="#34d399">enterprise</text>
    <text x="928" y="266" fill="#34d399" text-anchor="end">0% 429 — never limited</text>
  </g>
  <line x1="572" y1="282" x2="928" y2="282" stroke="#23324d"/>
  <text x="572" y="302" fill="#e8edf5" font-size="11" font-weight="bold">DELIVERY (the quiet part)</text>
  <g font-size="9" fill="#7e8aa3">
    <text x="572" y="320">report jobs enqueued under load: every single one completed —</text>
    <text x="572" y="334">0 job-row-missing, 0 stuck queued, 0 in the DLQ</text>
  </g>

  <!-- footer -->
  <rect x="16" y="372" width="928" height="36" rx="8" fill="#111a2e" stroke="#23324d"/>
  <text x="32" y="394" fill="#7e8aa3" font-size="10">reproduce: make lab &amp;&amp; make load-smoke load-run load-isolation   ·   the GIF next to this chart is the same isolation run, captured live from /metrics (make capture-gif)</text>
</svg>
