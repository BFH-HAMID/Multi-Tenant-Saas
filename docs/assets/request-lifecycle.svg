<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Request lifecycle: edge, auth, tenant, rate limit, handler, cache, Postgres RLS">
  <!-- Animated pipeline diagram. SMIL animations (animateMotion) render on
       GitHub, which proxies SVG through img tags. Colors match the live-capture
       GIF and the Grafana dashboards. -->
  <rect width="960" height="330" fill="#0b1220"/>
  <text x="16" y="28" fill="#e8edf5" font-size="15" font-weight="bold">REQUEST LIFECYCLE</text>
  <text x="944" y="28" fill="#7e8aa3" font-size="10" text-anchor="end">every hop is gated, measured, and tenant-scoped</text>
  <line x1="16" y1="40" x2="944" y2="40" stroke="#23324d"/>

  <!-- ============================ stage boxes ============================ -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="16" y="60" width="118" height="54" rx="8" fill="#111a2e" stroke="#23324d"/>
    <text x="75" y="83" fill="#e8edf5">EDGE</text>
    <rect x="162" y="60" width="118" height="54" rx="8" fill="#111a2e" stroke="#23324d"/>
    <text x="221" y="83" fill="#e8edf5">AUTH</text>
    <rect x="308" y="60" width="126" height="54" rx="8" fill="#111a2e" stroke="#23324d"/>
    <text x="371" y="83" fill="#e8edf5">TENANT</text>
    <rect x="456" y="60" width="140" height="54" rx="8" fill="#111a2e" stroke="#fbbf24" stroke-opacity="0.55"/>
    <text x="526" y="83" fill="#e8edf5">RATE LIMIT</text>
    <rect x="622" y="60" width="150" height="54" rx="8" fill="#111a2e" stroke="#23324d"/>
    <text x="697" y="83" fill="#e8edf5">HANDLER</text>
  </g>
  <g font-size="9" fill="#7e8aa3" text-anchor="middle">
    <text x="75" y="100">nginx · limit-rps</text>
    <text x="221" y="100">JWT verify · tid claim</text>
    <text x="371" y="100">header / slug / host</text>
    <text x="526" y="100">token bucket · per plan</text>
    <text x="697" y="100">SET LOCAL app.tenant_id</text>
  </g>

  <!-- connectors -->
  <g stroke="#23324d" stroke-width="2">
    <line x1="134" y1="87" x2="162" y2="87"/>
    <line x1="280" y1="87" x2="308" y2="87"/>
    <line x1="434" y1="87" x2="456" y2="87"/>
    <line x1="596" y1="87" x2="622" y2="87"/>
    <line x1="772" y1="87" x2="906" y2="87"/>
    <path d="M697,114 L697,150 L660,150 L660,170" fill="none"/>
    <path d="M760,150 L760,170" fill="none"/>
  </g>

  <!-- data tier -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="560" y="170" width="150" height="54" rx="8" fill="#111a2e" stroke="#23324d"/>
    <text x="635" y="193" fill="#34d399">CACHE</text>
    <rect x="740" y="170" width="204" height="54" rx="8" fill="#111a2e" stroke="#23324d"/>
    <text x="842" y="193" fill="#60a5fa">POSTGRES</text>
  </g>
  <g font-size="9" fill="#7e8aa3" text-anchor="middle">
    <text x="635" y="210">aside · t:{tenant}:c:v{n}</text>
    <text x="842" y="210">RLS forced · pool as app_user</text>
  </g>
  <g stroke="#23324d" stroke-width="2" stroke-dasharray="4 3">
    <path d="M710,197 L740,197"/>
  </g>
  <text x="725" y="188" fill="#7e8aa3" font-size="9" text-anchor="middle">miss</text>

  <!-- response label -->
  <text x="920" y="78" fill="#34d399" font-size="11" text-anchor="middle" font-weight="bold">2xx</text>
  <text x="920" y="108" fill="#7e8aa3" font-size="8" text-anchor="middle">problem+json on error</text>

  <!-- 429 badge (pulses in sync with the rejected red request) -->
  <g>
    <rect x="494" y="34" width="64" height="20" rx="6" fill="#f87171" fill-opacity="0.15" stroke="#f87171"/>
    <text x="526" y="48" fill="#f87171" font-size="11" text-anchor="middle" font-weight="bold">429</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.86;0.90;0.97;1" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- ============================== moving dots ============================== -->
  <!-- admitted request: edge -> auth -> tenant -> limiter (allow) -> handler -->
  <circle r="5" fill="#60a5fa">
    <animateMotion dur="7s" repeatCount="indefinite" path="M0,87 L772,87"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- response dot: leaves once the request has arrived -->
  <circle r="4" fill="#34d399">
    <animateMotion dur="7s" begin="4.9s" repeatCount="indefinite" path="M772,87 L906,87"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="7s" begin="4.9s" repeatCount="indefinite"/>
  </circle>

  <!-- throttled request: same road, but the trail ends at the bucket -->
  <circle r="5" fill="#f87171">
    <animateMotion dur="9s" repeatCount="indefinite" path="M0,87 L596,87"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.86;0.94;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- handler <-> cache circuit (read-through) -->
  <circle r="4" fill="#34d399">
    <animateMotion dur="3.2s" repeatCount="indefinite"
      path="M697,114 L697,150 L660,150 L660,170 L660,190 L697,190 L697,150"/>
  </circle>

  <!-- cache miss -> postgres and back -->
  <circle r="4" fill="#a78bfa">
    <animateMotion dur="4.1s" begin="1.1s" repeatCount="indefinite"
      path="M710,197 L740,197 L800,197 L740,197 L710,197"/>
  </circle>

  <!-- async side-effect: the handler also writes the outbox row (same tx) -->
  <text x="697" y="248" fill="#a78bfa" font-size="9" text-anchor="middle">writes outbox row in the same tx → BullMQ after COMMIT (see delivery diagram)</text>
  <g stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6">
    <path d="M697,124 L697,242"/>
  </g>

  <!-- footer: the measured claim this picture is drawn against -->
  <rect x="16" y="270" width="928" height="40" rx="8" fill="#111a2e" stroke="#23324d"/>
  <text x="32" y="287" fill="#7e8aa3" font-size="10">MEASURED (live capture, 2 vCPU host, 1 API pod):</text>
  <text x="32" y="302" fill="#e8edf5" font-size="11" font-weight="bold">835 req/s offered · p95 7.6 ms · 0 5xx · cache hit 99.7% · one tenant at 772 rps while four free tenants held p95 ≤ 9.7 ms</text>
</svg>
