apiVersion: 1

providers:
  - name: saas
    folder: Multi-Tenant SaaS
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Generated by `node infra/grafana/dashboards/build.mjs`, and edited there rather
      # than in the UI: dashboard JSON is the only file in this repo that a reviewer
      # cannot read as a diff after someone clicks around in a browser.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
