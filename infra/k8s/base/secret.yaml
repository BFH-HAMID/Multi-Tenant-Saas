# Secret *placeholders*. This file exists so `kubectl kustomize` renders a
# complete, valid cluster — NOT so anyone deploys these values.
#
# For a real cluster, replace the stringData with your secret manager's
# reference (SealedSecret / ExternalSecret / infisical) and never commit the
# result:
#
#   kubectl create secret generic api-secrets -n saas-prod \
#     --from-literal=DATABASE_URL=...      --from-literal=JWT_SECRET=... \
#     --from-literal=REDIS_CACHE_URL=...   --from-literal=REDIS_QUEUE_URL=... \
#     --from-literal=DATABASE_URL_ADMIN=... --from-literal=APP_USER_PASSWORD=... \
#     --from-literal=SHARED_SECRET=...
#
# DATABASE_URL_ADMIN is read ONLY by the migrate Job; the api/worker Deployments
# mount the same Secret for convenience but the app role URL (DATABASE_URL) is
# the only one their code paths use. APP_USER_PASSWORD exists so `db bootstrap`
# can (re)create the least-privilege login role — in production, provision the
# role out-of-band and delete that key instead.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  labels:
    app.kubernetes.io/name: saas-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://app_user:REPLACE-ME@postgres:5432/saas"
  DATABASE_URL_ADMIN: "postgres://REPLACE-ME@postgres:5432/saas"
  APP_USER_PASSWORD: "REPLACE-ME"
  REDIS_CACHE_URL: "redis://redis-cache:6379/0"
  REDIS_QUEUE_URL: "redis://redis-queue:6379/0"
  JWT_SECRET: "REPLACE-ME-openssl-rand-base64-48"
  SHARED_SECRET: "REPLACE-ME-openssl-rand-base64-32"
