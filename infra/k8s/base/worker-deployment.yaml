# The worker: a separate Deployment (not a second container in the API pod)
# because it has a different memory profile (a few large report payloads vs
# many small requests), a different scaling signal (queue depth vs RPS/CPU),
# and a different blast radius — a wedged handler must never take request
# serving with it. See docs/adr/0002-bullmq.md and docs/adr/0008.
#
# Scaling is manual/HPA-on-queue-depth (see hpa-comment in overlays/prod):
# CPU is a poor proxy for a process that is mostly waiting on Postgres and
# Redis, so the default here is a fixed replica count the queue-depth alerts
# (QueueBacklogStuck, WorkerRelayNotTicking) watch over.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: queue-consumer
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: queue-consumer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9465"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
      # Jobs in flight at SIGTERM get up to this long to finish before the lease
      # expires (LEASE_SECONDS=120) and another worker re-claims them — that
      # handover is at-least-once by design, which is why every handler is
      # idempotent (docs/adr/0005-outbox-and-idempotency.md).
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: saas/worker:local # overlays set the real registry/tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9465
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: api-secrets
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=280"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            # /readyz: DB reachable and the relay is allowed to run. A worker
            # that cannot talk to Postgres must stop having leases handed to it.
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            # /healthz: process-only, same reasoning as the API.
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Workers close(): in-flight jobs drain first (bounded by
                # SHUTDOWN_GRACE_MS), so no artificial sleep is needed — unlike
                # the API there is no Service endpoint to wait on.
                command: ["sh", "-c", "sleep 2"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
