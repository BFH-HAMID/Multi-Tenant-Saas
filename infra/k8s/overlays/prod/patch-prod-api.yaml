# Prod API sizing. Requests vs limits is a real decision: requests reserve
# schedulable capacity (and drive the HPA's utilization denominator), limits
# bound the noisy-neighbour blast radius per pod. The heap cap tracks the
# limit at ~75%, same rule as compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=448"
          resources:
            requests:
              cpu: 250m
              memory: 320Mi
            limits:
              cpu: "1"
              memory: 640Mi
