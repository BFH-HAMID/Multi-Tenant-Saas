# Prod worker sizing: report payloads, not request churn — memory ceiling is
# the interesting one (REPORT_MAX_ROWS bounds each job; this bounds the pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=448"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 640Mi
