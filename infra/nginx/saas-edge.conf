# The edge: TLS, coarse flood control, and the client IP the app's limiter needs.
#
# Division of labour, because two rate limiters that disagree produce an outage that
# reads as a bug in whichever one you can see:
#
#   nginx  — per-IP *request rate*, generous, purely to stop a flood from spending
#            Node's event loop and Postgres connections before any app logic runs.
#   app    — the authoritative limiter: a Redis token bucket keyed per tenant and
#            route class, with per-plan geometry (free/pro/enterprise). nginx cannot
#            express "this workspace is on the free plan" and must not try.
#
# Everything here is therefore deliberately looser than the app's buckets: a request
# nginx rejects would be a 429 the app never metered, so throttling would become
# invisible in `ratelimit_decisions_total` and the plan-quota story would be a lie.

# The app reads X-Forwarded-For only when TRUST_PROXY=true, and TRUST_PROXY is only
# ever true behind this edge. Without these two lines every tenant in a data centre
# shares one bucket (everyone behind the same NAT/egress IP), and the per-IP auth
# brake below punishes every customer on that egress for one attacker's retries.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# Flood brakes. 10m of state holds ~160k keys; if you expect more, size it from your
# traffic, not from a blog post.
limit_req_zone $binary_remote_addr zone=auth_flood:10m rate=6r/s;
limit_req_zone $binary_remote_addr zone=anon_flood:10m  rate=25r/s;
# Coarse per-tenant backstop, keyed on the tenant slug the client announced (empty
# key = no limit, which is how requests without a slug skip this zone). At 200 r/s per
# tenant this can never fire before the app's own buckets for free or pro plans, so it
# only exists to stop one workspace from exhausting the shared connection pool.
limit_conn_zone $binary_remote_addr zone=perip:10m;
map $http_x_tenant_slug $tenant_flood_key {
    default                  $http_x_tenant_slug;
    ""                       "";
}
limit_req_zone $tenant_flood_key  zone=tenant_flood:10m rate=200r/s;

# 429 is a normal outcome of a token bucket, not a server error: never log at error
# level, and make the body byte-compatible with the API's own problem+json so one
# client implementation handles both.
limit_req_log_level warn;
limit_req_status 429;

# Bodies above the app's MAX_BODY_BYTES (512 KiB) are rejected here at 1 MiB. The
# window between 512 KiB and 1 MiB is where the app answers with a structured 413;
# above it nginx refuses before the body is buffered to disk.
client_max_body_size 1m;
client_body_timeout  15s;
client_header_timeout 15s;
send_timeout 15s;

upstream saas_api {
    server api:3000;
    # Idle keepalive to the upstream must be *shorter* than the server's
    # KEEP_ALIVE_TIMEOUT_MS (72s), or nginx reuses a connection the app has already
    # closed and every client intermittently sees "connection reset by peer".
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, so `proxy_pass http://api` is resolved at request time
    # and a rescaled API (new pods, same service name) needs no nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The internal listener (9464) is reachable on the compose network by name and
    # is never exposed here: /metrics, /readyz and /livez must not be public.
    location ~ ^/(metrics|readyz|livez|healthz)$ {
        return 404;
    }

    location ~ ^/v1/auth/(login|register|password|refresh)$ {
        limit_req zone=auth_flood burst=15 nodelay;
        proxy_pass http://saas_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Password endpoints must not be stored by anything between here and the user.
        add_header Cache-Control "no-store" always;
    }

    location / {
        limit_conn perip 100;
        limit_req zone=anon_flood    burst=50 nodelay;
        limit_req zone=tenant_flood  burst=100 nodelay;
        proxy_pass http://saas_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ETag/If-None-Match must survive the proxy: conditional GETs are a large
        # share of read traffic, and a `proxy_redirect`/buffering default that drops
        # ETag makes every one of them a full cache miss at the client.
        proxy_pass_header ETag;
        proxy_pass_header X-Cache;
        proxy_pass_header Retry-After;
        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;   # >= the app's REQUEST_TIMEOUT (30s), so the app
    }

    # @throttled is what a limit_req rejection becomes. Shaped like the API's own 429
    # (see packages/shared/src/errors.ts) with the same `Retry-After` hint, because a
    # client that special-cases the app's response must not have to also special-case
    # the edge's.
    error_page 429 = @throttled;
    location @throttled {
        default_type application/problem+json;
        add_header Retry-After 2 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"type":"https://docs.saas.dev/errors/rate_limited","title":"Too many requests","status":429,"code":"RATE_LIMITED","detail":"Too many requests from this address at the edge","requestId":"$request_id"}';
    }
}
